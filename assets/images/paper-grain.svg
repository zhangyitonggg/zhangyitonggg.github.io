<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <!-- Transparent warm pigment keeps the texture part of the paper. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="12" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .55  0 0 0 0 .51  0 0 0 0 .44  1 0 0 0 -.38"/>
    </filter>
    <filter id="fibers" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.065 0.48" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .49  0 0 0 0 .46  0 0 0 0 .39  1 0 0 0 -.46"/>
    </filter>
    <filter id="pulp" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" seed="3" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .56  0 0 0 0 .52  0 0 0 0 .43  1 0 0 0 -.4"/>
    </filter>
  </defs>
  <path opacity=".35" filter="url(#grain)" d="M0 0h320v320H0z"/>
  <path opacity=".18" filter="url(#fibers)" d="M0 0h320v320H0z"/>
  <path opacity=".08" filter="url(#pulp)" d="M0 0h320v320H0z"/>
</svg>
